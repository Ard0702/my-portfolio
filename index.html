<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Портфолио</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Сәлем! Мен [Ардана]</h1>
        <p>Бастаушы Веб-девелопер</p>
    </header>

    <section id="about">
        <h2>Мен туралы</h2>
        <p>Мен веб-бағдарламалауды үйреніп жүрмін. VS Code және GitHub сияқты құралдарды меңгерудемін.</p>
    </section>

    <<section id="contact">
    <h2>Менімен байланысу</h2>
    <p>Сұрақтарыңыз немесе ұсыныстарыңыз болса, хабарлама қалдырыңыз:</p>
    
    <!-- action=" " ішіне өзіңіздің Formspree сілтемеңізді қойыңыз -->
    <form action="https://formspree.io/f/xzyqqwer" method="POST" class="contact-form">
        <div class="form-group">
            <label for="name">Атыңыз:</label>
            <input type="text" id="name" name="name" required placeholder="Мысалы: Арман">
        </div>

        <div class="form-group">
            <label for="email">Электронды поштаңыз:</label>
            <input type="email" id="email" name="email" required placeholder="name@example.com">
        </div>

        <div class="form-group">
            <label for="message">Хабарламаңыз:</label>
            <textarea id="message" name="message" rows="5" required placeholder="Сіздің хабарламаңыз..."></textarea>
        </div>

        <button type="submit" class="submit-btn">Жіберу</button>
    </form>
</section>
    <footer>
        <p>© 2026 Барлық құқықтар қорғалған.</p>
    </footer>
</body>
</html>
